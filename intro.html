<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GG84 — Intro</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
.video-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
video {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Evita il taglio laterale su smartphone preservando le proporzioni */
}
/* Su schermi desktop larghi usiamo il riempimento totale cinematico */
@media (min-width: 768px) {
    video {
        object-fit: cover;
    }
}
</style>
</head>
<body>
<div class="video-container">
    <video autoplay muted playsinline onended="location.href='index.html'">
        <source src="intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>
</body>
</html>
