<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

/* ───────────────────────────── */

#introVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

/* ───────────────────────────── */

#overlay{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at center,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.72)
    );

    z-index:20;

    backdrop-filter:blur(2px);

    transition:opacity 0.6s ease;
}

/* ───────────────────────────── */

#logo{
    width:130px;
    height:130px;
    object-fit:contain;

    margin-bottom:24px;

    filter:
        drop-shadow(0 0 18px rgba(57,231,95,0.45))
        drop-shadow(0 0 42px rgba(57,231,95,0.18));
}

/* ───────────────────────────── */

#enter{
    color:#39e75f;

    font-size:14px;
    letter-spacing:6px;

    padding:16px 34px;

    border:1px solid rgba(57,231,95,0.25);
    border-radius:40px;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(10px);

    cursor:pointer;

    transition:0.25s;

    user-select:none;
}

#enter:hover{
    transform:scale(1.03);

    border-color:rgba(57,231,95,0.55);

    box-shadow:
        0 0 20px rgba(57,231,95,0.18),
        0 0 60px rgba(57,231,95,0.08);
}

/* ───────────────────────────── */

#subtitle{
    margin-top:18px;

    color:rgba(255,255,255,0.45);

    font-size:11px;

    letter-spacing:4px;
}

/* ───────────────────────────── */

#skip{
    position:fixed;

    bottom:38px;
    left:50%;

    transform:translateX(-50%);

    z-index:15;

    color:rgba(255,255,255,0.45);

    font-size:12px;

    letter-spacing:4px;

    padding:10px 18px;

    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;

    backdrop-filter:blur(10px);

    cursor:pointer;

    transition:0.25s;

    display:none;
}

#skip:hover{
    color:#39e75f;

    border-color:rgba(57,231,95,0.35);

    box-shadow:0 0 20px rgba(57,231,95,0.18);
}


/* ── GG84 MOBILE VIDEO PATCH ───────────────────────────────── */
@media (max-width: 700px), (orientation: portrait){

    html,
    body{
        width:100%;
        height:100svh;
        min-height:100svh;
        overflow:hidden;
        background:#000;
    }

    #introVideo{
        width:100vw;
        height:100svh;
        object-fit:contain;
        object-position:center center;
        background:#000;
    }

    #overlay{
        padding:
            calc(env(safe-area-inset-top, 0px) + 24px)
            20px
            calc(env(safe-area-inset-bottom, 0px) + 24px);
    }

    #logo{
        width:104px;
        height:104px;
        margin-bottom:20px;
    }

    #enter{
        font-size:12px;
        letter-spacing:4px;
        padding:14px 26px;
    }

    #subtitle{
        font-size:10px;
        letter-spacing:3px;
        text-align:center;
    }

    #skip{
        bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
        font-size:10px;
        letter-spacing:3px;
        padding:9px 15px;
    }
}

/* Telefono in verticale: il video è orizzontale e pieno di scritte.
   Al tocco su «TAP TO ENTER» va a schermo intero e in orizzontale
   (Android); dove non si può (iPhone) compare l'invito a ruotare. */
#rotate{
    position:fixed;
    left:50%;
    top:calc(env(safe-area-inset-top, 0px) + 22px);
    transform:translateX(-50%);
    z-index:16;
    display:none;
    align-items:center;
    gap:10px;
    color:rgba(255,255,255,0.78);
    font-size:12px;
    letter-spacing:3px;
    padding:10px 16px;
    border:1px solid rgba(57,231,95,0.30);
    border-radius:30px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(10px);
    white-space:nowrap;
}

#rotate svg{
    width:20px;
    height:20px;
    flex:0 0 auto;
    animation:gg84ruota 1.8s ease-in-out infinite;
}

@keyframes gg84ruota{
    0%, 25%  { transform:rotate(0deg); }
    55%, 100%{ transform:rotate(-90deg); }
}

@media (orientation: landscape){
    #rotate{ display:none !important; }
}

@media (orientation: landscape) and (max-height: 520px){

    #introVideo{
        object-fit:contain;
        object-position:center center;
    }

    #logo{
        width:82px;
        height:82px;
        margin-bottom:14px;
    }

    #enter{
        padding:12px 24px;
        font-size:11px;
    }

    #subtitle{
        margin-top:12px;
    }
}

</style>

<body>

<!-- VIDEO -->

<video
    id="introVideo"
    playsinline
    preload="auto"
    disablePictureInPicture
    controlsList="nodownload"
    oncontextmenu="return false"
>
    <source src="index.mp4" type="video/mp4">
</video>

<!-- OVERLAY ENTER -->

<div id="overlay">

    <img
        src="logo3.png"
        id="logo"
        alt="GG84 Logo"
    >

    <div id="enter">
        TAP TO ENTER
    </div>

    <div id="subtitle">
        SECURE PRIVATE PROTOCOL
    </div>

</div>

<!-- SKIP -->

<div id="skip">
    TAP TO SKIP
</div>

<!-- RUOTA (solo dove lo schermo intero orizzontale non si può) -->

<div id="rotate" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="#39e75f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2"/>
        <line x1="11" y1="18.5" x2="13" y2="18.5"/>
    </svg>
    RUOTA IL TELEFONO
</div>

<script>

const video     = document.getElementById("introVideo");
const overlay   = document.getElementById("overlay");
const enterBtn  = document.getElementById("enter");
const skipBtn   = document.getElementById("skip");
const rotateTip = document.getElementById("rotate");

/* ───────────────────────────── */

function goHome(){

    try{
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }catch(e){}

    window.location.href = "home.html";

}

/* ───────────────────────────── */

// telefono in verticale: schermo intero e orizzontale

function isPortraitPhone(){

    return window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;

}

/* Alcuni browser lasciano la richiesta in sospeso senza rispondere:
   dopo un secondo e mezzo si rinuncia e si chiede di ruotare. */
function withTimeout(promise, ms){

    return Promise.race([
        promise,
        new Promise((resolve, reject) => setTimeout(() => reject(new Error("nessuna risposta")), ms))
    ]);

}

async function goBigOnPhone(){

    if (!isPortraitPhone()) return;

    const page = document.documentElement;

    if (page.requestFullscreen && screen.orientation && screen.orientation.lock){
        try{
            await withTimeout(page.requestFullscreen({ navigationUI: "hide" }), 1500);
            await withTimeout(screen.orientation.lock("landscape"), 1500);
            return;
        }catch(err){
            console.log(err);
            try{
                if (document.fullscreenElement) await document.exitFullscreen();
            }catch(e){}
        }
    }

    rotateTip.style.display = "flex";

}

window.addEventListener("orientationchange", () => {
    if (!isPortraitPhone()) rotateTip.style.display = "none";
});

/* ───────────────────────────── */

async function startExperience(){

    try{

        overlay.style.opacity = "0";

        setTimeout(() => {

            overlay.style.display = "none";

        }, 600);

        skipBtn.style.display = "block";

        video.muted = false;

        video.volume = 1;

        const playing = video.play();

        await goBigOnPhone();

        await playing;

    }catch(err){

        console.log(err);

    }

}

/* ───────────────────────────── */

// TAP TO ENTER

enterBtn.addEventListener("click", startExperience);

/* ───────────────────────────── */

// redirect fine video

video.addEventListener("ended", goHome);

/* ───────────────────────────── */

// skip manuale

skipBtn.addEventListener("click", goHome);

</script>

<!-- Il passaggio a home.html avviene via JavaScript: senza questo link i motori di
     ricerca si fermano qui e non indicizzano mai il sito vero. Chi ha JS attivo
     non lo vede nemmeno. -->
<noscript>
    <a href="home.html">Entra nel sito — Enter the site</a>
</noscript>

</body>
</html>
