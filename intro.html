<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>GG84 — Secure Private Protocol</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

/* ───────────────────────────── */

#introVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

/* ───────────────────────────── */

#overlay{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at center,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.72)
    );

    z-index:20;

    backdrop-filter:blur(2px);

    transition:opacity 0.6s ease;
}

/* ───────────────────────────── */

#logo{
    width:130px;
    height:130px;
    object-fit:contain;

    margin-bottom:24px;

    filter:
        drop-shadow(0 0 18px rgba(57,231,95,0.45))
        drop-shadow(0 0 42px rgba(57,231,95,0.18));
}

/* ───────────────────────────── */

#enter{
    color:#39e75f;

    font-size:14px;
    letter-spacing:6px;

    padding:16px 34px;

    border:1px solid rgba(57,231,95,0.25);
    border-radius:40px;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(10px);

    cursor:pointer;

    transition:0.25s;

    user-select:none;
}

#enter:hover{
    transform:scale(1.03);

    border-color:rgba(57,231,95,0.55);

    box-shadow:
        0 0 20px rgba(57,231,95,0.18),
        0 0 60px rgba(57,231,95,0.08);
}

/* ───────────────────────────── */

#subtitle{
    margin-top:18px;

    color:rgba(255,255,255,0.45);

    font-size:11px;

    letter-spacing:4px;
}

/* ───────────────────────────── */

#skip{
    position:fixed;

    bottom:38px;
    left:50%;

    transform:translateX(-50%);

    z-index:15;

    color:rgba(255,255,255,0.45);

    font-size:12px;

    letter-spacing:4px;

    padding:10px 18px;

    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;

    backdrop-filter:blur(10px);

    cursor:pointer;

    transition:0.25s;

    display:none;
}

#skip:hover{
    color:#39e75f;

    border-color:rgba(57,231,95,0.35);

    box-shadow:0 0 20px rgba(57,231,95,0.18);
}


/* ── GG84 MOBILE VIDEO PATCH ───────────────────────────────── */
@media (max-width: 700px), (orientation: portrait){

    html,
    body{
        width:100%;
        height:100svh;
        min-height:100svh;
        overflow:hidden;
        background:#000;
    }

    #introVideo{
        width:100vw;
        height:100svh;
        object-fit:contain;
        object-position:center center;
        background:#000;
    }

    #overlay{
        padding:
            calc(env(safe-area-inset-top, 0px) + 24px)
            20px
            calc(env(safe-area-inset-bottom, 0px) + 24px);
    }

    #logo{
        width:104px;
        height:104px;
        margin-bottom:20px;
    }

    #enter{
        font-size:12px;
        letter-spacing:4px;
        padding:14px 26px;
    }

    #subtitle{
        font-size:10px;
        letter-spacing:3px;
        text-align:center;
    }

    #skip{
        bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
        font-size:10px;
        letter-spacing:3px;
        padding:9px 15px;
    }
}

@media (orientation: landscape) and (max-height: 520px){

    #introVideo{
        object-fit:contain;
        object-position:center center;
    }

    #logo{
        width:82px;
        height:82px;
        margin-bottom:14px;
    }

    #enter{
        padding:12px 24px;
        font-size:11px;
    }

    #subtitle{
        margin-top:12px;
    }
}

</style>
</head>

<body>

<!-- VIDEO -->

<video
    id="introVideo"
    playsinline
    preload="auto"
    disablePictureInPicture
    controlsList="nodownload"
    oncontextmenu="return false"
>
    <source src="index.mp4" type="video/mp4">
</video>

<!-- OVERLAY ENTER -->

<div id="overlay">

    <img
        src="logo3.png"
        id="logo"
        alt="GG84 Logo"
    >

    <div id="enter">
        TAP TO ENTER
    </div>

    <div id="subtitle">
        SECURE PRIVATE PROTOCOL
    </div>

</div>

<!-- SKIP -->

<div id="skip">
    TAP TO SKIP
</div>

<script>

const video     = document.getElementById("introVideo");
const overlay   = document.getElementById("overlay");
const enterBtn  = document.getElementById("enter");
const skipBtn   = document.getElementById("skip");

/* ───────────────────────────── */

function goHome(){

    window.location.href = "home.html";

}

/* ───────────────────────────── */

async function startExperience(){

    try{

        overlay.style.opacity = "0";

        setTimeout(() => {

            overlay.style.display = "none";

        }, 600);

        skipBtn.style.display = "block";

        video.muted = false;

        video.volume = 1;

        await video.play();

    }catch(err){

        console.log(err);

    }

}

/* ───────────────────────────── */

// TAP TO ENTER

enterBtn.addEventListener("click", startExperience);

/* ───────────────────────────── */

// redirect fine video

video.addEventListener("ended", goHome);

/* ───────────────────────────── */

// skip manuale

skipBtn.addEventListener("click", goHome);

</script>

</body>
</html>
