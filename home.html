<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GG84 — Home Dashboard</title>
<style>
:root{
    --green:#39ff14;
    --green-soft:#39e75f;
    --green-glow:rgba(57,231,95,0.18);
    --bg:#000;
    --text:#e8f5ea;
    --muted:#7a8c7d;
}
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:"Segoe UI", Arial, sans-serif;
    color:var(--text);
}
.dashboard{
    position:fixed;
    top:12px; left:12px; right:12px; bottom:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(57,231,95,0.35);
    border-radius:24px;
    padding:20px;
    background: linear-gradient(180deg, #050605 0%, #000 100%);
}
.status-panel{
    text-align:center;
}
.status-title {
    font-size: 1.2rem;
    letter-spacing: 0.2em;
    color: var(--green);
    text-shadow: 0 0 10px rgba(57,255,20,0.3);
    text-transform: uppercase;
}

@media (min-width: 768px) {
    .dashboard { top:18px; left:18px; right:18px; bottom:18px; border-radius:38px; padding:40px; }
    .status-title { font-size: 1.8rem; letter-spacing: 0.34em; }
}
</style>
</head>
<body>
<div class="dashboard">
    <div class="status-panel">
        <div class="status-title">OVERLAY NET: ACTIVE</div>
    </div>
</div>
</body>
</html>
